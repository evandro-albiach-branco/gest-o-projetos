<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vista Geral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg:#F1F5FA; --surface:#FFFFFF; --surface-alt:#E7EEF6; --border:#D2DDEA;
    --ink:#0F1B2D; --muted:#5B6B80; --muted2:#82909F; --accent:#15529E; --accent-ink:#FFFFFF;
    --amber-fg:#8A6A06; --red-fg:#AE2043; --red-bg:#FBE9EE; --red-border:#F1C0CE;
    --success-fg:#146B52;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0E1520; --surface:#161F2D; --surface-alt:#1A2434; --border:#293748; --ink:#E9EEF5; --muted:#96A3B5; --muted2:#748097; }
  }
  :root[data-theme="dark"] { --bg:#0E1520; --surface:#161F2D; --surface-alt:#1A2434; --border:#293748; --ink:#E9EEF5; --muted:#96A3B5; --muted2:#748097; }
  * { box-sizing: border-box; }
  html,body { margin: 0; height:100%; }
  body { background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  input, select, button { font-family: inherit; }
  a { color: var(--accent); }
  .eyebrow { font-size:10.5px; text-transform:uppercase; letter-spacing:0.09em; font-weight:700; color:var(--muted2); }
  .seg-group { display:flex; background:var(--border); border-radius:6px; padding:3px; }
  .seg-btn { border:none; background:transparent; color:var(--muted); padding:5px 12px; font-size:12px; font-weight:700; border-radius:4px; cursor:pointer; }
  .seg-btn.active { background:var(--ink); color:var(--bg); }
  .nav-btn { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#8DA3BC; background:transparent; border:none; padding:0; }
  .nav-btn.active { background:var(--accent); color:#fff; }
  .nav-btn:hover:not(.active) { background:rgba(255,255,255,0.06); }
  .tag { display:inline-flex; align-items:center; gap:5px; padding:2px 7px; border-radius:4px; font-size:10.5px; font-weight:700; border:1px solid transparent; white-space:nowrap; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:10px; padding:2px 7px; border-radius:4px; color:#fff; font-weight:600; letter-spacing:0.01em; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; transition: box-shadow .18s ease, border-color .18s ease; }
  .card:hover { box-shadow: 0 6px 20px rgba(10,20,35,0.09); }
  .card.linked { border-color:#7FA8D6; box-shadow: 0 0 0 2px rgba(174,32,67,0.28); }
  .itemTitle { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15.5px; font-weight: 700; line-height:1.25; }
  .actionRow { padding: 10px 2px; border-top: 1px solid var(--border); transition: background .18s ease; border-radius:4px; }
  .actionRow.linked { background: var(--red-bg); box-shadow: inset 0 0 0 1px var(--red-border); }
  .depDot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex:0 0 6px; }
  .statusSelect { border: 1px solid var(--border); border-radius: 5px; padding: 3px 20px 3px 8px; font-size: 10.5px; font-weight: 700;
    background-color: transparent; color: var(--ink); cursor: pointer; appearance: none; -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%230F1B2D' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 6px center; background-size:8px; }
  .statusSelect--filled { border-color: var(--red-border); background-color: var(--red-bg); color: var(--red-fg); }
  .btn { border: 1px solid transparent; border-radius: 6px; padding: 8px 15px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-accent { background: var(--accent); color: var(--accent-ink); }
  .btn-line { background: transparent; border-color: var(--border); color: var(--muted); }
  .btn-ghost { background:none; border:none; color:var(--accent); padding:0; font-size:12px; font-weight:700; cursor:pointer; }
  .linkChip { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--red-fg); background:none; border:none; padding:0; cursor:pointer; border-bottom:1px dashed var(--red-border); }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 11px; }
  .field label { font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .field input, .field select { border: 1px solid var(--border); border-radius: 5px; padding: 7px 10px; font-size: 13px; background: var(--surface); color: var(--ink); }
  .colHeader { padding: 4px 2px 12px; border-bottom: 2px solid; margin-bottom:16px; }
  .toolbar { flex:0 0 auto; display:flex; align-items:center; padding:0 30px; background:var(--surface); }
  ::placeholder { color: var(--muted2); }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:6px; }
</style>
</head>
<body>

<div id="loginOverlay" style="display:flex; position:fixed; inset:0; background:var(--bg); align-items:center; justify-content:center; z-index:60;">
  <div style="width:340px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:28px 26px;">
    <div style="font-size:19px; font-weight:700; margin-bottom:4px;">Vista Geral</div>
    <div style="font-size:12px; color:var(--muted2); margin-bottom:20px;">entre com a conta criada no Supabase</div>
    <div class="field"><label>E-mail</label><input id="loginEmail" type="email"></div>
    <div class="field"><label>Senha</label><input id="loginPass" type="password"></div>
    <div id="loginError" style="font-size:12px; color:var(--red-fg); margin-bottom:8px; display:none;"></div>
    <button id="btnLogin" class="btn btn-accent" style="width:100%; margin-top:6px;">Entrar</button>
  </div>
</div>

<div id="appRoot" style="display:none; flex-direction:row; height:100vh; overflow:hidden;">

  <div id="navRail" style="width:58px; flex:0 0 58px; background:var(--ink); display:flex; flex-direction:column; align-items:center; padding:18px 0; gap:10px;">
    <svg width="24" height="24" viewBox="0 0 26 26" style="flex:0 0 24px; margin-bottom:10px;">
      <circle cx="6" cy="20" r="3" fill="var(--accent)"></circle><circle cx="20" cy="6" r="3" fill="#8DA3BC"></circle>
      <circle cx="20" cy="20" r="3" fill="none" stroke="var(--accent)" stroke-width="2"></circle>
      <line x1="8.4" y1="18.2" x2="17.6" y2="7.8" stroke="#33465F" stroke-width="1.6"></line>
      <line x1="8.4" y1="20" x2="17" y2="20" stroke="#33465F" stroke-width="1.6"></line>
    </svg>

    <button type="button" class="nav-btn" data-view="portfolio" title="Portfólio — Programas">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="3" y1="9" x2="21" y2="9"></line></svg>
    </button>
    <button type="button" class="nav-btn" data-view="transversal" title="Transversais">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line><line x1="8" y1="3" x2="4" y2="21"></line></svg>
    </button>
    <button type="button" class="nav-btn" data-view="board" title="Quadro">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
    </button>
    <button type="button" class="nav-btn" data-view="flow" title="Fluxograma">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"></circle><circle cx="18" cy="6" r="2.5"></circle><circle cx="12" cy="18" r="2.5"></circle><line x1="8" y1="7" x2="16" y2="7"></line><line x1="7" y1="8.3" x2="11" y2="16"></line><line x1="17" y1="8.3" x2="13" y2="16"></line></svg>
    </button>
    <button type="button" class="nav-btn" data-view="completed" title="Concluídos">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="8 12 11 15 16 9"></polyline></svg>
    </button>

    <div style="flex:1;"></div>

    <button type="button" id="btnToggleRadar" class="nav-btn" title="Radar de Atenção">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="7" x2="12" y2="12"></line><line x1="12" y1="12" x2="15.5" y2="14.5"></line></svg>
    </button>
    <button type="button" class="nav-btn" title="Configurações (em breve)" style="opacity:0.4; cursor:default;" disabled>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></svg>
    </button>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative;">

  <div class="toolbar" style="height:60px; justify-content:space-between; border-bottom:1px solid var(--border);">
    <div style="display:flex; align-items:center; gap:13px;">
      <div>
        <div id="pageTitle" style="font-size:19px; font-weight:700; line-height:1;">Portfólio</div>
        <div id="syncStatus" style="font-size:11px; color:var(--muted2); margin-top:3px;">conectado ao banco de dados</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <input id="searchInput" type="text" placeholder="buscar..." style="border:1px solid var(--border); border-radius:6px; padding:7px 12px; font-size:13px; width:170px; background:var(--surface-alt); color:var(--ink);">
      <button id="btnNovo" class="btn btn-accent">+ Novo projeto</button>
      <button id="btnNovoContainer" class="btn btn-line">+ Programa/Eixo</button>
      <button id="btnRefresh" class="btn btn-line" title="Recarregar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
      </button>
      <button id="btnLogout" class="btn btn-line">Sair</button>
    </div>
  </div>

  <div class="toolbar" id="boardSettingsRow" style="height:46px; gap:16px; background:var(--surface-alt); border-bottom:1px solid var(--border);">
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="eyebrow">Conexões</span>
      <div class="seg-group">
        <button id="btnConnHover" class="seg-btn" data-group="connectionMode" data-val="hover">Ao passar mouse</button>
        <button id="btnConnAlways" class="seg-btn" data-group="connectionMode" data-val="always">Sempre visíveis</button>
      </div>
    </div>
    <div style="width:1px; align-self:stretch; background:var(--border);"></div>
    <select id="filterStatus" style="border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:12px; background:var(--surface); color:var(--ink);"></select>
    <select id="filterDependsOn" style="border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:12px; background:var(--surface); color:var(--ink);">
      <option value="all">Depende de: todos</option><option value="eu">Você</option><option value="terceiro">Terceiro</option><option value="ninguem">Ninguém</option>
    </select>
    <select id="filterResponsible" style="border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:12px; background:var(--surface); color:var(--ink);"></select>
    <button id="btnClearFilters" class="btn-ghost">limpar</button>
    <div id="focusBadge" style="display:none; margin-left:auto; align-items:center; gap:8px;"></div>
  </div>

  <div class="toolbar" id="bigNumbers" style="height:48px; gap:28px; border-bottom:1px solid var(--border);"></div>

  <div style="flex: 1; display: flex; overflow: hidden; position:relative;">
    <div id="portfolioWrap" style="display:block; flex:1; overflow:auto; padding:28px 32px;"></div>
    <div id="board" style="display:none; flex:1; overflow:auto; padding:28px 32px;">
      <div id="boardInner" style="position:relative;">
        <svg id="connectorSvg" style="position:absolute; top:0; left:0; pointer-events:none; overflow:visible;"></svg>
        <div id="columns" style="display:flex; align-items:flex-start; position:relative;"></div>
      </div>
    </div>
    <div id="flowWrap" style="display:none; flex:1; overflow:auto; padding:28px 32px; background:var(--surface-alt);">
      <div id="flowchartCanvas"></div>
    </div>
    <div id="completedWrap" style="display:none; flex:1; overflow:auto; padding:28px 32px;">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap;">
        <span style="font-size:16px; font-weight:700;">Itens concluídos</span>
        <select id="completedContainer" style="border:1px solid var(--border); border-radius:6px; padding:6px 9px; font-size:12px; background:var(--surface); color:var(--ink);"></select>
        <label style="font-size:12px; color:var(--muted);">de <input id="completedFrom" type="month" style="border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:12px; background:var(--surface); color:var(--ink);"></label>
        <label style="font-size:12px; color:var(--muted);">até <input id="completedTo" type="month" style="border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:12px; background:var(--surface); color:var(--ink);"></label>
        <button id="btnCompletedClear" class="btn-ghost">limpar filtro</button>
      </div>
      <div id="completedSummary" style="display:flex; gap:26px; margin-bottom:20px;"></div>
      <div id="completedList" style="max-width:760px;"></div>
    </div>

    <div id="radarBackdrop" style="display:none; position:absolute; inset:0; background:rgba(10,15,25,0.25); z-index:39;"></div>
    <div id="radarDrawer" style="position:absolute; top:0; right:0; height:100%; width:320px; background:var(--surface); border-left:1px solid var(--border); overflow-y:auto; padding:22px 20px; transform:translateX(100%); transition:transform .22s ease; z-index:40; box-shadow:-8px 0 24px rgba(10,15,25,0.12);">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div style="font-size:16px; font-weight:700;">Radar de Atenção</div>
        <button id="btnCloseRadar" style="border:none; background:none; cursor:pointer; color:var(--muted); padding:4px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div style="font-size:11.5px; color:var(--muted2); margin-bottom:18px;">calculado a partir dos dados do banco</div>
      <div id="radar"></div>
    </div>
  </div>

  </div>
</div>

<div id="containerFormOverlay" style="display:none; position:fixed; inset:0; background:rgba(10,15,25,0.5); align-items:center; justify-content:center; z-index:50;">
  <div style="background:var(--surface); border-radius:10px; padding:24px 26px; width:340px; border:1px solid var(--border);">
    <div id="containerFormTitle" style="font-size:18px; font-weight:700; margin-bottom:15px;">Novo Programa/Eixo</div>
    <div class="field"><label>Nome</label><input id="cName" type="text" placeholder="ex: Captacao de Recursos" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label>Tipo</label>
      <select id="cType"><option value="programa">Programa</option><option value="frente">Transversal</option></select>
    </div>
    <div class="field"><label>Subtítulo (opcional)</label><input id="cSubtitle" type="text" placeholder="ex: Eixo transversal" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label>Cor</label><input id="cColor" type="color" value="#15529E" style="height:38px; padding:3px;"></div>
    <div id="containerFormError" style="font-size:12px; color:var(--red-fg); margin-bottom:6px; display:none;"></div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button id="cDelete" class="btn" style="display:none; background:var(--red-bg); color:var(--red-fg); border:1px solid var(--red-border);">Excluir</button>
      <button id="cCancel" class="btn btn-line" style="flex:1;">Cancelar</button>
      <button id="cSave" class="btn btn-accent" style="flex:1;">Salvar</button>
    </div>
  </div>
</div>

<div id="depFormOverlay" style="display:none; position:fixed; inset:0; background:rgba(10,15,25,0.5); align-items:center; justify-content:center; z-index:50;">
  <div style="background:var(--surface); border-radius:10px; padding:24px 26px; width:380px; border:1px solid var(--border);">
    <div style="font-size:18px; font-weight:700; margin-bottom:4px;">Vincular dependência</div>
    <div style="font-size:12.5px; color:var(--muted2); margin-bottom:16px;">Item travado: <strong id="depTargetName" style="color:var(--ink);"></strong></div>
    <div class="field"><label>Travado por</label><select id="depSourceSelect"></select></div>
    <div class="field"><label>Motivo (opcional)</label><input id="depReason" type="text" placeholder="ex: aguardando dado consolidado" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div id="depFormError" style="font-size:12px; color:var(--red-fg); margin-bottom:6px; display:none;"></div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button id="depCancel" class="btn btn-line" style="flex:1;">Cancelar</button>
      <button id="depSave" class="btn btn-accent" style="flex:1;">Salvar</button>
    </div>
  </div>
</div>

<div id="formOverlay" style="display:none; position:fixed; inset:0; background:rgba(10,15,25,0.5); align-items:center; justify-content:center; z-index:50;">
  <div style="background:var(--surface); border-radius:10px; padding:24px 26px; width:380px; max-height:86vh; overflow:auto; border:1px solid var(--border);">
    <div id="fTitle" style="font-size:18px; font-weight:700; margin-bottom:15px;">Novo projeto</div>
    <div class="field"><label>Nome</label><input id="fName" type="text" placeholder="Nome do item" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label>Tipo</label>
      <select id="fType"><option>Projeto</option><option>Publicacao</option><option>Orientacao</option><option>Processo de Prestacao de Contas</option><option>Proposta/Edital</option><option>Atividade recorrente</option></select>
    </div>
    <div class="field"><label>Programa(s)/Eixo(s)</label><div id="fContainers" style="display:flex; flex-direction:column; gap:6px;"></div></div>
    <div class="field"><label>Responsável</label><input id="fResp" type="text" placeholder="ex: Evandro" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label>Equipe (nomes separados por vírgula)</label><input id="fTeam" type="text" placeholder="ex: Karina, Sabrina, Celly" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label>Próxima ação depende de</label><select id="fDep"><option value="eu">Você</option><option value="terceiro">Terceiro</option><option value="ninguem">Ninguém no momento</option></select></div>
    <div class="field"><label>Prazo</label>
      <select id="fDueType" style="margin-bottom:6px;"><option value="data">Data específica</option><option value="na">N/A — sem prazo</option><option value="continuo">Contínuo</option></select>
      <input id="fDue" type="date">
    </div>
    <div class="field"><label>Peso estratégico</label><select id="fPriority"><option value="media">Médio</option><option value="alta">Alto</option><option value="baixa">Baixo</option></select></div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <button id="fDelete" class="btn" style="display:none; background:var(--red-bg); color:var(--red-fg); border:1px solid var(--red-border);">Excluir</button>
      <button id="fCancel" class="btn btn-line" style="flex:1;">Cancelar</button>
      <button id="fSave" class="btn btn-accent" style="flex:1;">Salvar</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ====== CONFIGURAÇÃO DE CONEXÃO ======
  var SUPABASE_URL = 'https://vbgfnuahuevdtgwyuhnr.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZiZ2ZudWFodWV2ZHRnd3l1aG5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NTE4NjQsImV4cCI6MjEwNTMyNzg2NH0.japNW5lpgWt7NWgc2SDWUeS0iTmTNgAXmyAmN6pAOF4';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var STATUSES = ['Em desenho','Em negociacao','Nao iniciado','Em andamento','Aguardando terceiro','Bloqueado','Atrasado','Concluido','Suspenso/Pausado'];
  var STALL_THRESHOLDS = { 'Publicacao': 21, 'default': 7 };

  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function parseBRDate(input){
    if(!input) return null;
    var m = input.trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(!m) return undefined;
    var dd = m[1].padStart(2,'0'), mm = m[2].padStart(2,'0'), yyyy = m[3];
    return yyyy+'-'+mm+'-'+dd;
  }
  function toBRDate(iso){ if(!iso) return ''; var p = iso.split('-'); return p[2]+'-'+p[1]+'-'+p[0]; }
  function askDateBR(message, currentISO){
    while(true){
      var input = window.prompt(message, toBRDate(currentISO));
      if(input===null) return undefined; // cancelou
      if(input.trim()===''){ return null; } // deixou em branco de propósito
      var iso = parseBRDate(input);
      if(iso===undefined){ window.alert('Data inválida. Use o formato DD-MM-AAAA (ex: 27-09-2026).'); continue; }
      return iso;
    }
  }
  function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
  function fmtDate(iso){ if(!iso) return '—'; var d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }
  function dueLabel(item){
    if(item.dueType==='na') return 'sem prazo (N/A)';
    if(item.dueType==='continuo') return 'contínuo';
    return item.due ? ('prazo '+fmtDate(item.due)) : 'sem prazo definido';
  }
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  var state = { containers: [], items: [] };
  var ui = { groupBy:'programa', connectionMode:'hover', view:'portfolio', radarOpen:false, focusContainerId:null, filters:{status:'all', dependsOn:'all', responsible:'all', search:''}, expanded:{} };

  // ====== CAMADA DE DADOS (Supabase) ======
  async function fetchState(){
    var [cRes, nRes, ncRes, dRes] = await Promise.all([
      sb.from('containers').select('*'),
      sb.from('nodes').select('*'),
      sb.from('node_containers').select('*'),
      sb.from('dependencies').select('*')
    ]);
    var containers = cRes.data || [];
    var nodes = nRes.data || [];
    var ncRows = ncRes.data || [];
    var deps = dRes.data || [];

    var ncByNode = {};
    ncRows.forEach(function(r){ (ncByNode[r.node_id] = ncByNode[r.node_id]||[]).push(r.container_id); });
    var depByTarget = {};
    deps.forEach(function(d){ depByTarget[d.target_node_id] = d; });
    var byParent = {};
    nodes.forEach(function(n){ var p = n.parent_id || '__root__'; (byParent[p]=byParent[p]||[]).push(n); });

    function toAppNode(n){
      var dep = depByTarget[n.id];
      return {
        id:n.id, name:n.name, type:n.type, status:n.status, responsible:n.responsible,
        dependsOn:n.depends_on, priority:n.priority, due:n.due_date, dueType:n.due_type||'data', lastUpdated:n.last_updated,
        completedAt:n.completed_at, posX:n.pos_x, posY:n.pos_y, team:n.team,
        blockReason: dep ? dep.reason : n.delay_reason,
        delayReason: n.delay_reason,
        blockedByRefId: dep ? dep.source_node_id : null,
        containerIds: ncByNode[n.id] || []
      };
    }
    var items = (byParent['__root__']||[]).map(function(n){
      var it = toAppNode(n);
      it.actions = (byParent[n.id]||[]).map(toAppNode);
      return it;
    });
    return { containers: containers.map(function(c){ return {id:c.id, name:c.name, type:c.type, color:c.color, subtitle:c.subtitle}; }), items: items };
  }

  async function refreshAndRender(){
    document.getElementById('syncStatus').textContent = 'sincronizando...';
    try {
      state = await fetchState();
      document.getElementById('syncStatus').textContent = 'conectado ao banco de dados';
    } catch(err){
      document.getElementById('syncStatus').textContent = 'erro ao sincronizar — veja o console';
      console.error(err);
    }
    renderAll();
  }

  async function dbUpdateNode(id, fields){
    var payload = {};
    if('status' in fields) payload.status = fields.status;
    if('due' in fields) payload.due_date = fields.due;
    if('dueType' in fields) payload.due_type = fields.dueType;
    if('delayReason' in fields) payload.delay_reason = fields.delayReason;
    if('lastUpdated' in fields) payload.last_updated = fields.lastUpdated;
    if('completedAt' in fields) payload.completed_at = fields.completedAt;
    if('name' in fields) payload.name = fields.name;
    if('type' in fields) payload.type = fields.type;
    if('responsible' in fields) payload.responsible = fields.responsible;
    if('dependsOn' in fields) payload.depends_on = fields.dependsOn;
    if('priority' in fields) payload.priority = fields.priority;
    if('posX' in fields) payload.pos_x = fields.posX;
    if('posY' in fields) payload.pos_y = fields.posY;
    if('team' in fields) payload.team = fields.team;
    var { error } = await sb.from('nodes').update(payload).eq('id', id);
    if(error){ window.alert('Erro ao salvar: '+error.message); console.error(error); }
  }
  async function dbDeleteNode(id){
    var { error } = await sb.from('nodes').delete().eq('id', id);
    if(error){ window.alert('Erro ao excluir: '+error.message); console.error(error); return false; }
    return true;
  }
  async function dbDeleteContainer(id){
    var { error } = await sb.from('containers').delete().eq('id', id);
    if(error){ window.alert('Erro ao excluir: '+error.message); console.error(error); return false; }
    return true;
  }
  async function dbSyncNodeContainers(nodeId, containerIds){
    await sb.from('node_containers').delete().eq('node_id', nodeId);
    if(containerIds.length) await sb.from('node_containers').insert(containerIds.map(function(cid){ return {node_id:nodeId, container_id:cid}; }));
  }
  async function dbInsertNode(node){
    var { data, error } = await sb.from('nodes').insert(node).select().single();
    if(error){ window.alert('Erro ao criar item: '+error.message); console.error(error); return null; }
    return data;
  }
  async function dbInsertNodeContainers(nodeId, containerIds){
    if(!containerIds.length) return;
    var rows = containerIds.map(function(cid){ return { node_id: nodeId, container_id: cid }; });
    var { error } = await sb.from('node_containers').insert(rows);
    if(error) console.error(error);
  }

  function findRef(refId){
    var idx = buildIndex(); return idx[refId];
  }
  function buildIndex(){
    var idx = {};
    state.items.forEach(function(it){
      idx[it.id] = {label: it.name, itemId: it.id};
      (it.actions||[]).forEach(function(a){ idx[a.id] = {label: a.name, itemId: it.id, actionId: a.id, itemName: it.name}; });
    });
    return idx;
  }
  function findNodeByRef(refId){
    var ref = findRef(refId); if(!ref) return null;
    var it = state.items.find(function(i){return i.id===ref.itemId;});
    if(ref.actionId) return it.actions.find(function(a){return a.id===ref.actionId;});
    return it;
  }
  function flattenAll(){
    var out = [];
    state.items.forEach(function(it){ out.push({node:it, refId:it.id}); (it.actions||[]).forEach(function(a){ out.push({node:a, refId:a.id}); }); });
    return out;
  }
  function isBlockingOthers(refId){ return flattenAll().some(function(x){ return x.node.status==='Bloqueado' && x.node.blockedByRefId===refId; }); }
  function getLinkPartners(refId){
    var partners = [];
    var self = findNodeByRef(refId);
    if(self && self.status==='Bloqueado' && self.blockedByRefId) partners.push(self.blockedByRefId);
    flattenAll().forEach(function(x){ if(x.node.status==='Bloqueado' && x.node.blockedByRefId===refId) partners.push(x.refId); });
    return partners;
  }

  function computeScore(node, refId){
    var score = 0;
    if(node.status==='Atrasado') score += 50;
    else if(node.due && node.dueType!=='na' && node.dueType!=='continuo'){ var d=daysBetween(todayISO(), node.due); if(d<=3) score += Math.max(30-d*5,5); }
    if(node.dependsOn==='eu') score += 20;
    if(isBlockingOthers(refId)) score += 25;
    if(node.priority==='alta') score += 15; else if(node.priority==='media') score += 5;
    return score;
  }
  function priorityTier(score){ if(score>=55) return 'Alta'; if(score>=25) return 'Media'; return 'Baixa'; }

  async function changeStatus(node, refId, newStatus, onDone){
    var fields = { status:newStatus, lastUpdated: todayISO() };
    if(newStatus==='Bloqueado'){
      var reason = window.prompt('O que está bloqueando este item?', node.delayReason||node.blockReason||''); if(reason===null) return;
      fields.delayReason = reason;
    }
    if(newStatus==='Atrasado'){
      var just = window.prompt('Justificativa do atraso:', node.delayReason||''); if(just===null) return;
      var novoPrazo = askDateBR('Novo prazo acordado (DD-MM-AAAA):', node.due||todayISO()); if(novoPrazo===undefined) return;
      fields.delayReason = just; fields.due = novoPrazo;
    }
    if(newStatus==='Concluido'){ if(!window.confirm('Confirmar entrega/aceite deste item?')) return; fields.completedAt = todayISO(); }
    await dbUpdateNode(refId, fields);
    onDone();
  }

  function groupItems(){
    var filtered = applyFilters(state.items);
    if(ui.focusContainerId){
      var fc = state.containers.find(function(c){ return c.id===ui.focusContainerId; });
      if(fc){
        var items = filtered.filter(function(it){ return it.containerIds.indexOf(fc.id)!==-1; });
        items.sort(function(a,b){ return computeScore(b,b.id)-computeScore(a,a.id); });
        return items.length ? [{container:fc, items:items}] : [{container:fc, items:[]}];
      }
    }
    var groups = state.containers.map(function(c){ return {container:c, items: filtered.filter(function(it){ return it.containerIds.indexOf(c.id)!==-1; })}; });
    var ungrouped = filtered.filter(function(it){ return it.containerIds.length===0; });
    groups.push({container:{id:'none', name:'Sem Programa/Eixo', color:'#5B6B80', subtitle:'Itens não vinculados a nenhum contêiner'}, items: ungrouped});
    groups.forEach(function(g){ g.items.sort(function(a,b){ return computeScore(b,b.id)-computeScore(a,a.id); }); });
    return groups.filter(function(g){ return g.items.length>0; });
  }
  function applyFilters(items){
    var f = ui.filters;
    return items.filter(function(it){
      if(f.status==='all' && it.status==='Concluido') return false;
      if(f.status!=='all' && it.status!==f.status) return false;
      if(f.dependsOn!=='all' && it.dependsOn!==f.dependsOn) return false;
      if(f.responsible!=='all' && it.responsible!==f.responsible) return false;
      if(f.search){
        var s=f.search.toLowerCase();
        var hit = it.name.toLowerCase().indexOf(s)!==-1 || (it.responsible||'').toLowerCase().indexOf(s)!==-1;
        var aHit = (it.actions||[]).some(function(a){ return a.name.toLowerCase().indexOf(s)!==-1; });
        if(!hit && !aHit) return false;
      }
      return true;
    });
  }

  function teamChips(item){
    if(!item.team) return '';
    var names = item.team.split(',').map(function(s){return s.trim();}).filter(Boolean);
    if(!names.length) return '';
    return '<div style="margin-top:6px; display:flex; flex-wrap:wrap; gap:5px; align-items:center;">'+
      '<span style="font-size:10px; color:var(--muted2);">equipe:</span>'+
      names.map(function(n){ return '<span style="font-size:10.5px; background:var(--surface-alt); border:1px solid var(--border); border-radius:999px; padding:2px 8px; color:var(--ink);">'+escapeHtml(n)+'</span>'; }).join('')+
    '</div>';
  }
  function containerChips(item){
    return item.containerIds.map(function(cid){
      var c = state.containers.find(function(x){return x.id===cid;});
      return c ? '<span class="chip" style="background:'+c.color+';">'+escapeHtml(c.name)+'</span>' : '';
    }).join(' ');
  }
  function depDotColor(dep){ return dep==='eu'?'#146B52':dep==='terceiro'?'#82909F':'#C6D2E0'; }
  function depLabel(dep){ return dep==='eu'?'depende de você':dep==='terceiro'?'depende de terceiro':'sem pendência'; }

  function linkButtonHtml(refId){
    return '<button type="button" data-action="linkDependency" data-noderef="'+refId+'" title="Vincular dependência" style="border:1px solid var(--border); background:var(--surface); border-radius:5px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); flex:0 0 22px;">'+
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.5"></path><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07L12.5 19.5"></path></svg>'+
    '</button>';
  }
  function editButtonHtml(itemId){
    return '<button type="button" data-action="editItem" data-itemid="'+itemId+'" title="Editar" style="border:1px solid var(--border); background:var(--surface); border-radius:5px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); flex:0 0 22px;">'+
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>'+
    '</button>';
  }
  function deleteActionButtonHtml(refId){
    return '<button type="button" data-action="deleteAction" data-noderef="'+refId+'" title="Excluir ação" style="border:1px solid var(--border); background:var(--surface); border-radius:5px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); flex:0 0 22px;">'+
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>'+
    '</button>';
  }
  function editActionButtonHtml(refId){
    return '<button type="button" data-action="editAction" data-noderef="'+refId+'" title="Editar ação" style="border:1px solid var(--border); background:var(--surface); border-radius:5px; width:22px; height:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); flex:0 0 22px;">'+
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>'+
    '</button>';
  }

  function statusTagHtml(node, refId){
    var s = node.status, isCritical = (s==='Bloqueado'||s==='Atrasado');
    var opts = STATUSES.map(function(st){ return '<option value="'+st+'"'+(st===s?' selected':'')+'>'+st+'</option>'; }).join('');
    if(isCritical) return '<select class="statusSelect statusSelect--filled" data-refid="'+refId+'" data-action="changeStatus">'+opts+'</select>';
    return '<select class="statusSelect" data-refid="'+refId+'" data-action="changeStatus">'+opts+'</select>';
  }

  function renderActionRow(item, action){
    var linkChip = '';
    if(action.status==='Bloqueado'){
      var target = action.blockedByRefId ? findRef(action.blockedByRefId) : null;
      var label = target ? (target.label+(target.itemName?' ('+target.itemName+')':'')) : (action.blockReason||'motivo nao especificado');
      linkChip = '<div style="margin-top:6px;">'+
        (action.blockedByRefId ? '<button type="button" class="linkChip" data-action="focusLink" data-target="'+action.blockedByRefId+'">Bloqueado por: '+label+'</button>' :
          '<span style="font-size:11px; color:var(--red-fg); font-weight:600;">Bloqueado — '+label+'</span>')+
        (action.blockReason ? '<div style="font-size:10.5px; color:var(--muted); margin-top:2px;">'+escapeHtml(action.blockReason)+'</div>' : '')+
      '</div>';
    }
    if(action.status==='Atrasado' && action.delayReason){ linkChip += '<div style="font-size:11px; color:var(--red-fg); margin-top:6px;">Atraso: '+escapeHtml(action.delayReason)+'</div>'; }
    return '<div class="actionRow" data-noderef="'+action.id+'">'+
      '<div style="font-size:12.5px; font-weight:600; line-height:1.35;">'+escapeHtml(action.name)+'</div>'+
      '<div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px;">'+
        statusTagHtml(action, action.id)+
        '<div style="display:flex; align-items:center; gap:6px;">'+linkButtonHtml(action.id)+editActionButtonHtml(action.id)+deleteActionButtonHtml(action.id)+'</div>'+
      '</div>'+
      '<div style="display:flex; align-items:center; gap:6px; margin-top:6px; font-size:11px; color:var(--muted);">'+
        '<span class="depDot" style="background:'+depDotColor(action.dependsOn)+';"></span>'+depLabel(action.dependsOn)+
        ' · '+dueLabel(action)+
      '</div>'+linkChip+
    '</div>';
  }

  function renderItemCard(item, color, pos){
    var posStyle = pos ? ('position:absolute; left:'+pos.x+'px; top:'+pos.y+'px; width:330px; cursor:grab; ') : '';
    var tier = priorityTier(computeScore(item, item.id));
    var expanded = ui.expanded[item.id];
    var actionsHtml = (item.actions||[]).map(function(a){ return renderActionRow(item,a); }).join('');
    var addActionBtn = '<button type="button" class="btn-ghost" data-action="addAction" data-itemid="'+item.id+'" style="margin-top:10px; display:block;">+ adicionar ação</button>';
    var actionsBlock = item.actions && item.actions.length ?
      ('<button type="button" class="btn-ghost" data-action="toggleExpand" data-itemid="'+item.id+'" style="margin-top:10px;">'+(expanded?'▴ recolher ações':'▾ '+item.actions.length+' ação(ões)')+'</button>'+(expanded?('<div>'+actionsHtml+'</div>'+addActionBtn):'')) :
      addActionBtn;

    var note = '';
    if(item.status==='Bloqueado' && item.blockReason) note = '<div style="font-size:11px; color:var(--red-fg); margin-top:7px; font-weight:600;">Bloqueado — '+escapeHtml(item.blockReason)+'</div>';
    if(item.status==='Atrasado' && item.delayReason) note += '<div style="font-size:11px; color:var(--red-fg); margin-top:7px;">Atraso: '+escapeHtml(item.delayReason)+'</div>';
    var blocksOthers = isBlockingOthers(item.id);
    var priorityTag = tier==='Alta' ? '<span class="tag" style="background:var(--red-bg); color:var(--red-fg); border-color:var(--red-border);">prioridade alta</span>' : '';
    var blocksTag = blocksOthers ? '<span class="tag" style="background:none; color:var(--red-fg); border-color:var(--red-border);">trava outro item</span>' : '';

    var progressHtml = '';
    if(item.actions && item.actions.length){
      var done = item.actions.filter(function(a){ return a.status==='Concluido'; }).length;
      var pct = Math.round(done/item.actions.length*100);
      progressHtml = '<div style="margin-top:11px;">'+
        '<div style="font-size:10.5px; color:var(--muted2); margin-bottom:4px;">'+done+' de '+item.actions.length+' ações concluídas · '+pct+'%</div>'+
        '<div style="height:5px; border-radius:999px; background:var(--border); overflow:hidden;"><div style="height:100%; width:'+pct+'%; background:'+color+'; border-radius:999px;"></div></div>'+
      '</div>';
    }

    return '<div class="card" data-noderef="'+item.id+'" style="'+posStyle+'border-left:3px solid '+color+';">'+
      '<div class="itemTitle" style="line-height:1.3;">'+escapeHtml(item.name)+'</div>'+
      '<div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:9px;">'+
        statusTagHtml(item, item.id)+
        '<div style="display:flex; align-items:center; gap:6px;">'+linkButtonHtml(item.id)+editButtonHtml(item.id)+'</div>'+
      '</div>'+
      '<div style="margin-top:9px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;">'+containerChips(item)+priorityTag+blocksTag+'</div>'+
      teamChips(item)+
      progressHtml+
      '<div style="display:flex; align-items:center; gap:6px; margin-top:10px; font-size:11.5px; color:var(--muted);">'+
        '<span class="depDot" style="background:'+depDotColor(item.dependsOn)+';"></span>'+depLabel(item.dependsOn)+
        ' · '+escapeHtml(item.responsible||'sem responsável')+' · '+dueLabel(item)+
      '</div>'+note+actionsBlock+
    '</div>';
  }

  function statusBucketColor(status){
    if(status==='Concluido') return '#146B52';
    if(status==='Bloqueado' || status==='Atrasado') return '#AE2043';
    if(status==='Aguardando terceiro') return '#8A6A06';
    if(status==='Em andamento') return '#15529E';
    return '#C3CDD9';
  }
  function columnDistribution(items){
    if(!items.length) return '';
    var counts = {};
    items.forEach(function(it){ counts[it.status] = (counts[it.status]||0)+1; });
    var segs = Object.keys(counts).map(function(s){
      var pct = (counts[s]/items.length*100).toFixed(1);
      return '<div style="width:'+pct+'%; background:'+statusBucketColor(s)+';" title="'+s+': '+counts[s]+'"></div>';
    }).join('');
    return '<div style="display:flex; height:5px; border-radius:3px; overflow:hidden; margin-top:9px; background:var(--border);">'+segs+'</div>';
  }

  var FLOW_W_ITEM = 220, FLOW_H_ITEM = 60, FLOW_W_ACTION = 196, FLOW_H_ACTION = 50, FLOW_COL_GAP = 70, FLOW_ROW_GAP = 22;

  function ensureFlowLayout(){
    var toSave = [];
    var containerCol = {}; var nextCol = 0; var colYCursor = {};
    state.items.forEach(function(it){
      var cKey = it.containerIds[0] || 'none';
      if(!(cKey in containerCol)){ containerCol[cKey] = nextCol++; colYCursor[containerCol[cKey]] = 70; }
      var col = containerCol[cKey];
      var x = 40 + col*(FLOW_W_ITEM+FLOW_COL_GAP);
      if(it.posX==null || it.posY==null){
        var y = colYCursor[col];
        it.posX = x; it.posY = y;
        toSave.push({id:it.id, x:x, y:y});
        colYCursor[col] = y + FLOW_H_ITEM + FLOW_ROW_GAP;
      } else {
        colYCursor[col] = Math.max(colYCursor[col], it.posY + FLOW_H_ITEM + FLOW_ROW_GAP);
      }
      (it.actions||[]).forEach(function(a){
        if(a.posX==null || a.posY==null){
          var ay = colYCursor[col];
          a.posX = x+18; a.posY = ay;
          toSave.push({id:a.id, x:a.posX, y:a.posY});
          colYCursor[col] = ay + FLOW_H_ACTION + FLOW_ROW_GAP;
        } else {
          colYCursor[col] = Math.max(colYCursor[col], a.posY + FLOW_H_ACTION + FLOW_ROW_GAP);
        }
      });
    });
    return { toSave: toSave, containerCol: containerCol };
  }

  function flowNodeSize(refId){
    var ref = findRef(refId);
    return (ref && ref.actionId) ? {w:FLOW_W_ACTION,h:FLOW_H_ACTION} : {w:FLOW_W_ITEM,h:FLOW_H_ITEM};
  }

  var flowDrag = null; // {mode:'move'|'connect', refId, node, startMouseX, startMouseY, startX, startY}

  function renderFlowchart(){
    var layout = ensureFlowLayout();
    if(layout.toSave.length){ layout.toSave.forEach(function(s){ dbUpdateNode(s.id, {posX:s.x, posY:s.y}); }); }

    var canvas = document.getElementById('flowchartCanvas');
    var maxX=900, maxY=500;
    var all = flattenAll();
    all.forEach(function(x){ var sz=flowNodeSize(x.refId); maxX=Math.max(maxX,(x.node.posX||0)+sz.w+60); maxY=Math.max(maxY,(x.node.posY||0)+sz.h+60); });

    var labels = Object.keys(layout.containerCol).map(function(key){
      var col = layout.containerCol[key];
      var c = key==='none' ? {name:'Sem Programa/Eixo', color:'#5B6B80'} : state.containers.find(function(x){return x.id===key;});
      if(!c) return '';
      var x = 40 + col*(FLOW_W_ITEM+FLOW_COL_GAP);
      return '<div style="position:absolute; left:'+x+'px; top:24px; font-size:11px; font-weight:700; color:'+c.color+';">'+escapeHtml(c.name)+'</div>';
    }).join('');

    var nodesHtml = all.map(function(x){
      var isItem = ('actions' in x.node);
      var sz = isItem ? {w:FLOW_W_ITEM,h:FLOW_H_ITEM} : {w:FLOW_W_ACTION,h:FLOW_H_ACTION};
      var st = statusBucketColor(x.node.status);
      return '<div class="flow-node" data-noderef="'+x.refId+'" style="position:absolute; left:'+(x.node.posX||0)+'px; top:'+(x.node.posY||0)+'px; width:'+sz.w+'px; min-height:'+sz.h+'px; background:var(--surface); border:1.5px solid '+st+'; border-radius:8px; padding:8px 10px; cursor:grab; box-shadow:0 2px 6px rgba(10,15,25,0.08); user-select:none;">'+
        '<div style="font-size:'+(isItem?'12px':'11px')+'; font-weight:'+(isItem?'700':'600')+'; line-height:1.25; max-height:2.6em; overflow:hidden;">'+escapeHtml(x.node.name)+'</div>'+
        '<div style="display:flex; align-items:center; gap:5px; margin-top:5px;"><span class="depDot" style="background:'+st+';"></span><span style="font-size:9.5px; color:var(--muted2);">'+x.node.status+'</span></div>'+
        '<div class="flow-handle" data-noderef="'+x.refId+'" title="Arraste até outro item para criar dependência" style="position:absolute; right:-7px; top:50%; margin-top:-6px; width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid var(--surface); cursor:crosshair;"></div>'+
      '</div>';
    }).join('');

    canvas.innerHTML = '<div style="font-size:11.5px; color:var(--muted2); margin-bottom:10px;">Arraste um cartão pelo corpo para reposicionar · arraste a bolinha da borda até outro cartão para criar uma dependência</div>'+
      '<div id="flowInner" style="position:relative; width:'+maxX+'px; height:'+maxY+'px; background-image:radial-gradient(circle, rgba(15,27,45,0.06) 1.2px, transparent 1.2px); background-size:22px 22px; border:1px solid var(--border); border-radius:10px;">'+
        '<svg id="flowEdges" width="'+maxX+'" height="'+maxY+'" style="position:absolute; top:0; left:0; pointer-events:none;"></svg>'+
        labels + nodesHtml +
      '</div>';
    renderFlowEdges();
  }

  function renderFlowEdges(extraLine){
    var svg = document.getElementById('flowEdges'); if(!svg) return;
    var defs = '<defs><marker id="flowArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AE2043"></path></marker></defs>';
    var paths = '';
    state.items.forEach(function(it){
      (it.actions||[]).forEach(function(a){
        var x1=(it.posX||0)+FLOW_W_ITEM/2, y1=(it.posY||0)+FLOW_H_ITEM;
        var x2=(a.posX||0)+FLOW_W_ACTION/2, y2=(a.posY||0);
        paths += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--border)" stroke-width="1.6"></line>';
      });
    });
    flattenAll().forEach(function(x){
      if(x.node.status==='Bloqueado' && x.node.blockedByRefId){
        var src = findNodeByRef(x.node.blockedByRefId), tgt = x.node;
        if(!src) return;
        var sSz = flowNodeSize(x.node.blockedByRefId), tSz = flowNodeSize(x.refId);
        var x1=(src.posX||0)+sSz.w, y1=(src.posY||0)+sSz.h/2, x2=(tgt.posX||0), y2=(tgt.posY||0)+tSz.h/2;
        var midX=(x1+x2)/2;
        paths += '<path d="M '+x1+' '+y1+' C '+midX+' '+y1+', '+midX+' '+y2+', '+x2+' '+y2+'" stroke="#AE2043" stroke-width="2.2" stroke-dasharray="1 6" stroke-linecap="round" fill="none" marker-end="url(#flowArrow)"></path>';
      }
    });
    if(extraLine){ paths += '<line x1="'+extraLine.x1+'" y1="'+extraLine.y1+'" x2="'+extraLine.x2+'" y2="'+extraLine.y2+'" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 4"></line>'; }
    svg.innerHTML = defs + paths;
  }

  document.getElementById('flowchartCanvas').addEventListener('mousedown', function(e){
    var handle = e.target.closest('.flow-handle');
    var nodeEl = e.target.closest('.flow-node');
    var inner = document.getElementById('flowInner');
    if(handle){
      var refId = handle.getAttribute('data-noderef');
      var node = findNodeByRef(refId); var sz = flowNodeSize(refId);
      flowDrag = { mode:'connect', refId:refId, x1:(node.posX||0)+sz.w, y1:(node.posY||0)+sz.h/2 };
      e.preventDefault();
      return;
    }
    if(nodeEl){
      var refId2 = nodeEl.getAttribute('data-noderef');
      var innerRect = inner.getBoundingClientRect();
      flowDrag = { mode:'move', refId:refId2, el:nodeEl, offsetX: e.clientX - innerRect.left - parseFloat(nodeEl.style.left), offsetY: e.clientY - innerRect.top - parseFloat(nodeEl.style.top), innerRect:innerRect };
      nodeEl.style.cursor = 'grabbing';
      e.preventDefault();
    }
  });
  document.addEventListener('mousemove', function(e){
    if(!flowDrag) return;
    if(flowDrag.mode==='move'){
      var nx = e.clientX - flowDrag.innerRect.left - flowDrag.offsetX;
      var ny = e.clientY - flowDrag.innerRect.top - flowDrag.offsetY;
      flowDrag.el.style.left = Math.max(0,nx)+'px'; flowDrag.el.style.top = Math.max(0,ny)+'px';
      var node = findNodeByRef(flowDrag.refId); node.posX = Math.max(0,nx); node.posY = Math.max(0,ny);
      renderFlowEdges();
    } else if(flowDrag.mode==='connect'){
      var inner = document.getElementById('flowInner'); var rect = inner.getBoundingClientRect();
      renderFlowEdges({ x1:flowDrag.x1, y1:flowDrag.y1, x2:e.clientX-rect.left, y2:e.clientY-rect.top });
    }
  });
  document.addEventListener('mouseup', function(e){
    if(!flowDrag) return;
    if(flowDrag.mode==='move'){
      var node = findNodeByRef(flowDrag.refId);
      dbUpdateNode(flowDrag.refId, { posX: Math.round(node.posX), posY: Math.round(node.posY) });
      flowDrag.el.style.cursor='grab';
    } else if(flowDrag.mode==='connect'){
      var target = document.elementFromPoint(e.clientX, e.clientY);
      var targetNodeEl = target ? target.closest('.flow-node') : null;
      if(targetNodeEl && targetNodeEl.getAttribute('data-noderef')!==flowDrag.refId){
        var targetRef = targetNodeEl.getAttribute('data-noderef');
        var reason = window.prompt('Motivo da dependência (o que o item de origem trava):', '');
        if(reason!==null){
          sb.from('dependencies').insert({ source_node_id: flowDrag.refId, target_node_id: targetRef, reason: reason||null }).then(function(){
            return dbUpdateNode(targetRef, { status:'Bloqueado', delayReason: reason, lastUpdated: todayISO() });
          }).then(refreshAndRender);
        }
      }
      renderFlowEdges();
    }
    flowDrag = null;
  });

  function renderCompleted(){
    var contSel = document.getElementById('completedContainer');
    if(!contSel.dataset.filled){
      contSel.innerHTML = '<option value="all">Programa/Eixo: todos</option>'+state.containers.map(function(c){ return '<option value="'+c.id+'">'+escapeHtml(c.name)+'</option>'; }).join('');
      contSel.dataset.filled = '1';
    }
    var containerFilter = contSel.value;
    var from = document.getElementById('completedFrom').value;
    var to = document.getElementById('completedTo').value;

    var all = flattenAll().filter(function(x){ return x.node.status==='Concluido' && x.node.completedAt; });
    if(containerFilter!=='all'){
      all = all.filter(function(x){
        var ref = findRef(x.refId);
        var it = state.items.find(function(i){return i.id===(ref.itemId||x.refId);});
        return it && it.containerIds.indexOf(containerFilter)!==-1;
      });
    }
    if(from){ all = all.filter(function(x){ return x.node.completedAt.slice(0,7) >= from; }); }
    if(to){ all = all.filter(function(x){ return x.node.completedAt.slice(0,7) <= to; }); }
    all.sort(function(a,b){ return b.node.completedAt.localeCompare(a.node.completedAt); });

    var byMonth = {};
    all.forEach(function(x){ var m=x.node.completedAt.slice(0,7); byMonth[m]=(byMonth[m]||0)+1; });
    var months = Object.keys(byMonth).sort();
    document.getElementById('completedSummary').innerHTML =
      '<div style="display:flex; align-items:baseline; gap:6px;"><span style="font-size:19px; font-weight:600; font-family:\'IBM Plex Mono\',monospace;">'+all.length+'</span><span style="font-size:11.5px; color:var(--muted2);">concluídos no período</span></div>'+
      (months.length ? '<div style="display:flex; align-items:baseline; gap:6px;"><span style="font-size:19px; font-weight:600; font-family:\'IBM Plex Mono\',monospace;">'+(all.length/months.length).toFixed(1)+'</span><span style="font-size:11.5px; color:var(--muted2);">média por mês</span></div>' : '');

    document.getElementById('completedList').innerHTML = all.length ? all.map(function(x){
      var ref = findRef(x.refId);
      var parent = ref && ref.itemName ? ' — '+escapeHtml(ref.itemName) : '';
      return '<div style="border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:baseline; gap:10px;">'+
        '<div><div style="font-size:13.5px; font-weight:600;">'+escapeHtml(x.node.name)+parent+'</div>'+
        '<div style="font-size:11.5px; color:var(--muted2); margin-top:2px;">'+escapeHtml(x.node.responsible||'')+'</div></div>'+
        '<div style="font-size:12px; color:var(--muted); white-space:nowrap;">'+fmtDate(x.node.completedAt)+'</div>'+
      '</div>';
    }).join('') : '<div style="color:var(--muted2); font-size:13px;">Nenhum item concluído nesse recorte.</div>';
  }

  var PAGE_TITLES = { portfolio:'Portfólio', transversal:'Transversais', board:'Quadro', flow:'Fluxograma', completed:'Concluídos' };

  function renderPortfolio(typeFilter){
    function healthFor(containerId){
      var items = state.items.filter(function(it){ return it.containerIds.indexOf(containerId)!==-1; });
      var critical = 0, dependVoce = 0, prazoProximo = 0, concluidos = 0;
      var respSet = {};
      items.forEach(function(it){
        if(it.responsible) respSet[it.responsible]=true;
        if(it.status==='Concluido') concluidos++;
        if(it.status==='Bloqueado' || it.status==='Atrasado') critical++;
        if(it.dependsOn==='eu' && it.status!=='Concluido') dependVoce++;
        if(it.due && it.dueType!=='na' && it.dueType!=='continuo' && it.status!=='Concluido' && daysBetween(todayISO(),it.due)<=7) prazoProximo++;
        (it.actions||[]).forEach(function(a){
          if(a.status==='Bloqueado' || a.status==='Atrasado') critical++;
          if(a.dependsOn==='eu' && a.status!=='Concluido') dependVoce++;
          if(a.due && a.dueType!=='na' && a.dueType!=='continuo' && a.status!=='Concluido' && daysBetween(todayISO(),a.due)<=7) prazoProximo++;
        });
      });
      return { items:items, critical:critical, dependVoce:dependVoce, prazoProximo:prazoProximo, concluidos:concluidos, respCount:Object.keys(respSet).length };
    }
    var containers = state.containers.filter(function(c){ return !typeFilter || c.type===typeFilter; });
    var cards = containers.map(function(c){
      var h = healthFor(c.id);
      function stat(n,label,color){ return n ? '<span style="font-size:11px; color:'+(color||'var(--muted)')+';">'+n+' '+label+'</span>' : ''; }
      var statsLine = [stat(h.critical,'crítico(s)','var(--red-fg)'), stat(h.prazoProximo,'prazo(s) em 7 dias','var(--amber-fg)'), stat(h.dependVoce,'com você'), stat(h.respCount,'responsáve(is)'), stat(h.concluidos,'concluído(s)','var(--success-fg)')].filter(Boolean).join(' · ');
      return '<div data-action="focusContainer" data-containerid="'+c.id+'" style="text-align:left; cursor:pointer; width:100%; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px 20px; display:block;">'+
        '<div style="display:flex; align-items:center; justify-content:space-between;">'+
          '<div style="display:flex; align-items:center; gap:7px;"><span style="font-size:15px; font-weight:700; color:'+c.color+';">'+escapeHtml(c.name)+'</span>'+
            '<button type="button" data-action="editContainer" data-containerid="'+c.id+'" title="Editar" style="border:none; background:none; cursor:pointer; color:var(--muted2); padding:0;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></button>'+
          '</div>'+
          (h.critical ? '<span class="tag" style="background:var(--red-bg); color:var(--red-fg); border-color:var(--red-border);">'+h.critical+' crítico(s)</span>' : '')+
        '</div>'+
        '<div style="font-size:11.5px; color:var(--muted2); margin-top:3px;">'+escapeHtml(c.subtitle||'')+' · '+h.items.length+' item(ns)</div>'+
        columnDistribution(h.items)+
        (statsLine ? '<div style="margin-top:9px;">'+statsLine+'</div>' : '')+
      '</div>';
    });
    var wrap = document.getElementById('portfolioWrap');
    if(!containers.length){
      wrap.innerHTML = '<div style="color:var(--muted2); font-size:13px;">Nenhum '+(typeFilter==='frente'?'Transversal':'Programa')+' cadastrado ainda. Use "+ Programa/Eixo" para começar.</div>';
      return;
    }
    wrap.innerHTML = '<div style="font-size:12.5px; color:var(--muted2); margin-bottom:18px;">Clique num cartão para abrir o quadro focado nele.</div>'+
      '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px; max-width:1200px;">'+cards.join('')+'</div>';
  }

      (state.containers.find(function(c){return c.id===ui.focusContainerId;})||{}).name || 'Quadro' : PAGE_TITLES[view];

  function ensureBoardLayout(items){

  var boardDrag = null;
  document.getElementById('columns').addEventListener('mousedown', function(e){

      offsetX: e.clientX - parentRect.left - parseFloat(card.style.left||0),
      offsetY: e.clientY - parentRect.top - parseFloat(card.style.top||0), parentRect: parentRect };
    card.style.cursor = 'grabbing';
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e){

  function computeAnchor(srcRect, tgtRect, rect){
    var x1,y1,x2,y2;
    if(srcRect.right <= tgtRect.left){ x1=srcRect.right-rect.left; y1=srcRect.top-rect.top+srcRect.height/2; x2=tgtRect.left-rect.left; y2=tgtRect.top-rect.top+tgtRect.height/2; }
    else if(tgtRect.right <= srcRect.left){ x1=srcRect.left-rect.left; y1=srcRect.top-rect.top+srcRect.height/2; x2=tgtRect.right-rect.left; y2=tgtRect.top-rect.top+tgtRect.height/2; }
    else { x1=srcRect.left-rect.left+srcRect.width/2; y1=srcRect.bottom-rect.top; x2=tgtRect.left-rect.left+tgtRect.width/2; y2=tgtRect.top-rect.top; }
    return [x1,y1,x2,y2];
  }
  function findVisibleNode(refId){
    var el = document.querySelector('#columns [data-noderef="'+refId+'"]');
    if(el) return el;
    var ref = findRef(refId);
    if(ref && ref.itemId) return document.querySelector('#columns [data-noderef="'+ref.itemId+'"]');
    return null;
  }
  function renderAllConnectors(){
    var columns = document.getElementById('columns');
    var svg = document.getElementById('connectorSvg');
    var rect = columns.getBoundingClientRect();
    var paths = '<defs><marker id="arrowhead2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#AE2043"></path></marker></defs>';
    flattenAll().forEach(function(x){
      if(x.node.status==='Bloqueado' && x.node.blockedByRefId){
        var srcEl = findVisibleNode(x.node.blockedByRefId), tgtEl = findVisibleNode(x.refId);
        if(srcEl && tgtEl && srcEl!==tgtEl){
          var sr=srcEl.getBoundingClientRect(), tr=tgtEl.getBoundingClientRect();
          var a = computeAnchor(sr,tr,rect); var midX=(a[0]+a[2])/2;
          paths += '<circle cx="'+a[0]+'" cy="'+a[1]+'" r="4" fill="#AE2043"></circle>'+
            '<path d="M '+a[0]+' '+a[1]+' C '+midX+' '+a[1]+', '+midX+' '+a[3]+', '+a[2]+' '+a[3]+'" stroke="#AE2043" stroke-width="2.2" stroke-dasharray="1 6" stroke-linecap="round" fill="none" marker-end="url(#arrowhead2)"></path>';
        }
      }
    });
    var w=Math.max(columns.scrollWidth,rect.width), h=Math.max(columns.scrollHeight,rect.height);
    svg.setAttribute('width',w); svg.setAttribute('height',h); svg.style.width=w+'px'; svg.style.height=h+'px';
    svg.innerHTML = paths;
  }

  function renderRadar(){
    var all = flattenAll();
    var blocked = all.filter(function(x){ return x.node.status==='Bloqueado'; });
    var deadlines = all.filter(function(x){ return x.node.due && x.node.dueType!=='na' && x.node.dueType!=='continuo' && x.node.status!=='Concluido'; }).map(function(x){ x.diff=daysBetween(todayISO(),x.node.due); return x; }).filter(function(x){ return x.diff<=3; }).sort(function(a,b){return a.diff-b.diff;});
    var stalled = all.filter(function(x){ if(x.node.status==='Concluido') return false; var th=STALL_THRESHOLDS[x.node.type]||STALL_THRESHOLDS['default']; return daysBetween(x.node.lastUpdated||todayISO(),todayISO())>=th; }).sort(function(a,b){return daysBetween(b.node.lastUpdated,todayISO())-daysBetween(a.node.lastUpdated,todayISO());});
    function section(title,color,list,renderer){ if(!list.length) return ''; return '<div class="eyebrow" style="color:'+color+'; margin:16px 0 9px;">'+title+' · '+list.length+'</div><div style="display:flex; flex-direction:column; gap:8px;">'+list.map(renderer).join('')+'</div>'; }
    var html = '';
    html += section('Dependências críticas','var(--red-fg)',blocked,function(x){ return '<div style="border:1px solid var(--border); border-radius:7px; padding:10px 12px;"><div style="font-size:12.5px; font-weight:600;">'+escapeHtml(x.node.name)+'</div><div style="font-size:11px; color:var(--muted2); margin-top:3px;">'+escapeHtml(x.node.blockReason||'sem detalhe')+'</div></div>'; });
    html += section('Prazos vencendo/vencidos','var(--amber-fg)',deadlines,function(x){ var l=x.diff<0?('vencido há '+Math.abs(x.diff)+' dia(s)'):(x.diff===0?'vence hoje':'vence em '+x.diff+' dia(s)'); return '<div style="border:1px solid var(--border); border-radius:7px; padding:10px 12px;"><div style="font-size:12.5px; font-weight:600;">'+escapeHtml(x.node.name)+'</div><div style="font-size:11px; color:'+(x.diff<0?'var(--red-fg)':'var(--amber-fg)')+'; margin-top:3px;">'+l+'</div></div>'; });
    html += section('Itens parados','var(--muted)',stalled,function(x){ var d=daysBetween(x.node.lastUpdated,todayISO()); return '<div style="border:1px solid var(--border); border-radius:7px; padding:10px 12px;"><div style="font-size:12.5px; font-weight:600;">'+escapeHtml(x.node.name)+'</div><div style="font-size:11px; color:var(--muted); margin-top:3px;">sem atualização há '+d+' dia(s)</div></div>'; });
    document.getElementById('radar').innerHTML = html || '<div style="color:var(--muted2); font-size:12px;">Nada pedindo atenção agora.</div>';
  }

        last_updated: todayISO()
      });
      if(newNode) await dbInsertNodeContainers(newNode.id, containerIds);
    }
    overlay.style.display='none';
    refreshAndRender();
  });

  // ====== AUTENTICAÇÃO ======
  function showLogin(){ document.getElementById('loginOverlay').style.display='flex'; document.getElementById('appRoot').style.display='none'; }
  async function showApp(){
    document.getElementById('loginOverlay').style.display='none';
    document.getElementById('appRoot').style.display='flex';
    state = await fetchState();
    ui.expanded = defaultExpand();
    renderRadar(); renderBigNumbers(); refreshFilterOptions(); updateSegButtons(); updateRadarDrawer(); updateFocusBadge();
    setView('portfolio');
  }
  document.getElementById('btnLogin').addEventListener('click', doLogin);
  document.getElementById('loginPass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  async function doLogin(){
    var email = document.getElementById('loginEmail').value.trim();
    var pass = document.getElementById('loginPass').value;
    var errEl = document.getElementById('loginError'); errEl.style.display='none';
    var { error } = await sb.auth.signInWithPassword({ email:email, password:pass });
    if(error){ errEl.textContent = 'Falha no login: '+error.message; errEl.style.display='block'; return; }
    showApp();
  }
  document.getElementById('btnLogout').addEventListener('click', async function(){ await sb.auth.signOut(); location.reload(); });

  sb.auth.getSession().then(function(res){
    if(res.data.session) showApp(); else showLogin();
  });
})();
</script>
</body>
</html>
