<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vista Geral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg:#F1F5FA; --surface:#FFFFFF; --surface-alt:#E7EEF6; --border:#D2DDEA;
    --ink:#0F1B2D; --muted:#5B6B80; --muted2:#82909F; --accent:#15529E; --accent-ink:#FFFFFF;
    --amber-fg:#8A6A06; --red-fg:#AE2043; --red-bg:#FBE9EE; --red-border:#F1C0CE;
    --success-fg:#146B52;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0E1520; --surface:#161F2D; --surface-alt:#1A2434; --border:#293748; --ink:#E9EEF5; --muted:#96A3B5; --muted2:#748097; }
  }
  :root[data-theme="dark"] { --bg:#0E1520; --surface:#161F2D; --surface-alt:#1A2434; --border:#293748; --ink:#E9EEF5; --muted:#96A3B5; --muted2:#748097; }
  * { box-sizing: border-box; }
  html,body { margin: 0; height:100%; }
  body { background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  input, select, button { font-family: inherit; }
  a { color: var(--accent); }
  .eyebrow { font-size:10.5px; text-transform:uppercase; letter-spacing:0.09em; font-weight:700; color:var(--muted2); }
  .tag { display:inline-flex; align-items:center; gap:5px; padding:2px 7px; border-radius:4px; font-size:10.5px; font-weight:700; border:1px solid transparent; white-space:nowrap; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:10px; padding:2px 7px; border-radius:4px; color:#fff; font-weight:600; letter-spacing:0.01em; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; transition: box-shadow .18s ease, border-color .18s ease; }
  .card:hover { box-shadow: 0 6px 20px rgba(10,20,35,0.09); }
  .card.linked { border-color:#7FA8D6; box-shadow: 0 0 0 2px rgba(174,32,67,0.28); }
  .itemTitle { font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15.5px; font-weight: 700; line-height:1.25; }
  .actionRow { padding: 10px 2px; border-top: 1px solid var(--border); transition: background .18s ease; border-radius:4px; }
  .actionRow.linked { background: var(--red-bg); box-shadow: inset 0 0 0 1px var(--red-border); }
  .depDot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex:0 0 6px; }
  .statusSelect { border: 1px solid var(--border); border-radius: 5px; padding: 3px 20px 3px 8px; font-size: 10.5px; font-weight: 700;
    background-color: transparent; color: var(--ink); cursor: pointer; appearance: none; -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%230F1B2D' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 6px center; background-size:8px; }
  .statusSelect--filled { border-color: var(--red-border); background-color: var(--red-bg); color: var(--red-fg); }
  .btn { border: 1px solid transparent; border-radius: 6px; padding: 8px 15px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-accent { background: var(--accent); color: var(--accent-ink); }
  .btn-line { background: transparent; border-color: var(--border); color: var(--muted); }
  .btn-ghost { background:none; border:none; color:var(--accent); padding:0; font-size:12px; font-weight:700; cursor:pointer; }
  .linkChip { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--red-fg); background:none; border:none; padding:0; cursor:pointer; border-bottom:1px dashed var(--red-border); }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 11px; }
  .field label { font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .field input, .field select { border: 1px solid var(--border); border-radius: 5px; padding: 7px 10px; font-size: 13px; background: var(--surface); color: var(--ink); }
  .colHeader { padding: 4px 2px 12px; border-bottom: 2px solid; margin-bottom:16px; }
  .toolbar { flex:0 0 auto; display:flex; align-items:center; padding:0 30px; background:var(--surface); }
  ::placeholder { color: var(--muted2); }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:6px; }
</style>
</head>
<body>

    </div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; overflow:hidden;">

  <div class="toolbar" style="height:66px; justify-content:space-between; border-bottom:1px solid var(--border);">
    <div style="display:flex; align-items:center; gap:13px;">

  <div style="flex: 1; display: flex; overflow: hidden;">

</div>

<div id="containerFormOverlay" style="display:none; position:fixed; inset:0; background:rgba(10,15,25,0.5); align-items:center; justify-content:center; z-index:50;">
  <div style="background:var(--surface); border-radius:10px; padding:24px 26px; width:340px; border:1px solid var(--border);">

    <div class="field"><label>Nome</label><input id="fName" type="text" placeholder="Nome do item"></div>
    <div class="field"><label>Tipo</label>
      <select id="fType"><option>Projeto</option><option>Publicacao</option><option>Orientacao</option><option>Processo de Prestacao de Contas</option><option>Proposta/Edital</option><option>Demanda em triagem</option><option>Atividade recorrente</option></select>

    <div class="field"><label>Contêiner(es)</label><div id="fContainers" style="display:flex; flex-direction:column; gap:6px;"></div></div>
    <div class="field"><label>Responsável</label><input id="fResp" type="text" placeholder="ex: Evandro"></div>
    <div class="field"><label>Próxima ação depende de</label><select id="fDep"><option value="eu">Você</option><option value="terceiro">Terceiro</option><option value="ninguem">Ninguém no momento</option></select></div>
    <div class="field"><label>Prazo</label><input id="fDue" type="date"></div>
    <div class="field"><label>Peso estratégico</label><select id="fPriority"><option value="media">Médio</option><option value="alta">Alto</option><option value="baixa">Baixo</option></select></div>

<script>
(function(){
  'use strict';

  // ====== CONFIGURAÇÃO DE CONEXÃO ======
  var SUPABASE_URL = 'https://vbgfnuahuevdtgwyuhnr.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZiZ2ZudWFodWV2ZHRnd3l1aG5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NTE4NjQsImV4cCI6MjEwNTMyNzg2NH0.japNW5lpgWt7NWgc2SDWUeS0iTmTNgAXmyAmN6pAOF4';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var STATUSES = ['Nao iniciado','Em andamento','Aguardando terceiro','Bloqueado','Atrasado','Concluido','Suspenso/Pausado'];
  var STALL_THRESHOLDS = { 'Publicacao': 21, 'default': 7 };

  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
  function fmtDate(iso){ if(!iso) return '—'; var d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  var state = { containers: [], items: [] };
  var ui = { groupBy:'programa', connectionMode:'hover', filters:{status:'all', dependsOn:'all', responsible:'all', search:''}, expanded:{} };

  // ====== CAMADA DE DADOS (Supabase) ======
  async function fetchState(){
    var [cRes, nRes, ncRes, dRes] = await Promise.all([
      sb.from('containers').select('*'),
      sb.from('nodes').select('*'),
      sb.from('node_containers').select('*'),
      sb.from('dependencies').select('*')
    ]);
    var containers = cRes.data || [];
    var nodes = nRes.data || [];
    var ncRows = ncRes.data || [];
    var deps = dRes.data || [];

    var ncByNode = {};
    ncRows.forEach(function(r){ (ncByNode[r.node_id] = ncByNode[r.node_id]||[]).push(r.container_id); });
    var depByTarget = {};
    deps.forEach(function(d){ depByTarget[d.target_node_id] = d; });
    var byParent = {};
    nodes.forEach(function(n){ var p = n.parent_id || '__root__'; (byParent[p]=byParent[p]||[]).push(n); });

    function toAppNode(n){
      var dep = depByTarget[n.id];
      return {
        id:n.id, name:n.name, type:n.type, status:n.status, responsible:n.responsible,
        dependsOn:n.depends_on, priority:n.priority, due:n.due_date, lastUpdated:n.last_updated,
        blockReason: dep ? dep.reason : n.delay_reason,
        delayReason: n.delay_reason,
        blockedByRefId: dep ? dep.source_node_id : null,
        containerIds: ncByNode[n.id] || []
      };
    }
    var items = (byParent['__root__']||[]).map(function(n){
      var it = toAppNode(n);
      it.actions = (byParent[n.id]||[]).map(toAppNode);
      return it;
    });
    return { containers: containers.map(function(c){ return {id:c.id, name:c.name, type:c.type, color:c.color, subtitle:c.subtitle}; }), items: items };
  }

  async function refreshAndRender(){
    document.getElementById('syncStatus').textContent = 'sincronizando...';
    try {
      state = await fetchState();
      document.getElementById('syncStatus').textContent = 'conectado ao banco de dados';
    } catch(err){
      document.getElementById('syncStatus').textContent = 'erro ao sincronizar — veja o console';
      console.error(err);
    }
    renderAll();
  }

  async function dbUpdateNode(id, fields){
    var payload = {};
    if('status' in fields) payload.status = fields.status;
    if('due' in fields) payload.due_date = fields.due;
    if('delayReason' in fields) payload.delay_reason = fields.delayReason;
    if('lastUpdated' in fields) payload.last_updated = fields.lastUpdated;
    var { error } = await sb.from('nodes').update(payload).eq('id', id);
    if(error){ window.alert('Erro ao salvar: '+error.message); console.error(error); }
  }
  async function dbInsertNode(node){
    var { data, error } = await sb.from('nodes').insert(node).select().single();
    if(error){ window.alert('Erro ao criar item: '+error.message); console.error(error); return null; }
    return data;
  }
  async function dbInsertNodeContainers(nodeId, containerIds){
    if(!containerIds.length) return;
    var rows = containerIds.map(function(cid){ return { node_id: nodeId, container_id: cid }; });
    var { error } = await sb.from('node_containers').insert(rows);
    if(error) console.error(error);
  }

  function findRef(refId){
    var idx = buildIndex(); return idx[refId];
  }
  function buildIndex(){
    var idx = {};
    state.items.forEach(function(it){
      idx[it.id] = {label: it.name, itemId: it.id};
      (it.actions||[]).forEach(function(a){ idx[a.id] = {label: a.name, itemId: it.id, actionId: a.id, itemName: it.name}; });
    });
    return idx;
  }
  function findNodeByRef(refId){
    var ref = findRef(refId); if(!ref) return null;
    var it = state.items.find(function(i){return i.id===ref.itemId;});
    if(ref.actionId) return it.actions.find(function(a){return a.id===ref.actionId;});
    return it;
  }
  function flattenAll(){
    var out = [];
    state.items.forEach(function(it){ out.push({node:it, refId:it.id}); (it.actions||[]).forEach(function(a){ out.push({node:a, refId:a.id}); }); });
    return out;
  }
  function isBlockingOthers(refId){ return flattenAll().some(function(x){ return x.node.status==='Bloqueado' && x.node.blockedByRefId===refId; }); }
  function getLinkPartners(refId){
    var partners = [];
    var self = findNodeByRef(refId);
    if(self && self.status==='Bloqueado' && self.blockedByRefId) partners.push(self.blockedByRefId);
    flattenAll().forEach(function(x){ if(x.node.status==='Bloqueado' && x.node.blockedByRefId===refId) partners.push(x.refId); });

  function computeScore(node, refId){
    var score = 0;
    if(node.status==='Atrasado') score += 50;
    else if(node.due){ var d=daysBetween(todayISO(), node.due); if(d<=3) score += Math.max(30-d*5,5); }
    if(node.dependsOn==='eu') score += 20;
    if(isBlockingOthers(refId)) score += 25;
    if(node.priority==='alta') score += 15; else if(node.priority==='media') score += 5;
    return score;
  }
  function priorityTier(score){ if(score>=55) return 'Alta'; if(score>=25) return 'Media'; return 'Baixa'; }

  async function changeStatus(node, refId, newStatus, onDone){

      fields.delayReason = reason;
    }
    if(newStatus==='Atrasado'){
      var just = window.prompt('Justificativa do atraso:', node.delayReason||''); if(just===null) return;
      var novoPrazo = window.prompt('Novo prazo acordado (AAAA-MM-DD):', node.due||todayISO()); if(novoPrazo===null) return;
      fields.delayReason = just; fields.due = novoPrazo;
    }
    if(newStatus==='Concluido'){ if(!window.confirm('Confirmar entrega/aceite deste item?')) return; }
    await dbUpdateNode(refId, fields);
    onDone();
  }

  function groupItems(){
    var groupContainers = state.containers.filter(function(c){ return c.type===ui.groupBy; });
    var filtered = applyFilters(state.items);
    var groups = groupContainers.map(function(c){ return {container:c, items: filtered.filter(function(it){ return it.containerIds.indexOf(c.id)!==-1; })}; });
    var ungrouped = filtered.filter(function(it){ return !it.containerIds.some(function(cid){ var c=state.containers.find(function(x){return x.id===cid;}); return c && c.type===ui.groupBy; }); });
    groups.push({container:{id:'none', name:'Sem '+(ui.groupBy==='programa'?'programa':'frente'), color:'#5B6B80', subtitle:'Sem contêiner deste tipo'}, items: ungrouped});
    groups.forEach(function(g){ g.items.sort(function(a,b){ return computeScore(b,b.id)-computeScore(a,a.id); }); });
    return groups.filter(function(g){ return g.items.length>0; });
  }
  function applyFilters(items){
    var f = ui.filters;
    return items.filter(function(it){
      if(f.status!=='all' && it.status!==f.status) return false;
      if(f.dependsOn!=='all' && it.dependsOn!==f.dependsOn) return false;
      if(f.responsible!=='all' && it.responsible!==f.responsible) return false;
      if(f.search){
        var s=f.search.toLowerCase();
        var hit = it.name.toLowerCase().indexOf(s)!==-1 || (it.responsible||'').toLowerCase().indexOf(s)!==-1;
        var aHit = (it.actions||[]).some(function(a){ return a.name.toLowerCase().indexOf(s)!==-1; });
        if(!hit && !aHit) return false;
      }
      return true;
    });
  }

  function renderItemCard(item, color){

  function statusBucketColor(status){

  function computeAnchor(srcRect, tgtRect, rect){
    var x1,y1,x2,y2;
    if(srcRect.right <= tgtRect.left){ x1=srcRect.right-rect.left; y1=srcRect.top-rect.top+srcRect.height/2; x2=tgtRect.left-rect.left; y2=tgtRect.top-rect.top+tgtRect.height/2; }
    else if(tgtRect.right <= srcRect.left){ x1=srcRect.left-rect.left; y1=srcRect.top-rect.top+srcRect.height/2; x2=tgtRect.right-rect.left; y2=tgtRect.top-rect.top+tgtRect.height/2; }
    else { x1=srcRect.left-rect.left+srcRect.width/2; y1=srcRect.bottom-rect.top; x2=tgtRect.left-rect.left+tgtRect.width/2; y2=tgtRect.top-rect.top; }
    return [x1,y1,x2,y2];
  }
  function findVisibleNode(refId){

    return null;

  function renderAllConnectors(){

    flattenAll().forEach(function(x){
      if(x.node.status==='Bloqueado' && x.node.blockedByRefId){
        var srcEl = findVisibleNode(x.node.blockedByRefId), tgtEl = findVisibleNode(x.refId);
        if(srcEl && tgtEl && srcEl!==tgtEl){
          var sr=srcEl.getBoundingClientRect(), tr=tgtEl.getBoundingClientRect();
          var a = computeAnchor(sr,tr,rect); var midX=(a[0]+a[2])/2;
          paths += '<circle cx="'+a[0]+'" cy="'+a[1]+'" r="4" fill="#AE2043"></circle>'+
            '<path d="M '+a[0]+' '+a[1]+' C '+midX+' '+a[1]+', '+midX+' '+a[3]+', '+a[2]+' '+a[3]+'" stroke="#AE2043" stroke-width="2.2" stroke-dasharray="1 6" stroke-linecap="round" fill="none" marker-end="url(#arrowhead2)"></path>';
        }
      }
    });
    var w=Math.max(columns.scrollWidth,rect.width), h=Math.max(columns.scrollHeight,rect.height);

  function highlightLink(refId, partners){

  function renderRadar(){
    var all = flattenAll();

    var stalled = all.filter(function(x){ if(x.node.status==='Concluido') return false; var th=STALL_THRESHOLDS[x.node.type]||STALL_THRESHOLDS['default']; return daysBetween(x.node.lastUpdated||todayISO(),todayISO())>=th; }).sort(function(a,b){return daysBetween(b.node.lastUpdated,todayISO())-daysBetween(a.node.lastUpdated,todayISO());});

  var columnsEl = document.getElementById('columns');

  });
  columnsEl.addEventListener('mouseout', function(e){
    if(ui.connectionMode==='always') return;
    var el = e.target.closest('[data-noderef]'); if(!el) return;
    if(!el.contains(e.relatedTarget)){ delete el.dataset.hoverLock; clearHighlight(); }
  });

  document.getElementById('btnGroupPrograma').addEventListener('click', function(){ ui.groupBy='programa'; renderAll(); });
  document.getElementById('btnGroupFrente').addEventListener('click', function(){ ui.groupBy='frente'; renderAll(); });
  document.getElementById('btnConnHover').addEventListener('click', function(){ ui.connectionMode='hover'; updateConnectionButtons(); redrawConnectorsForMode(); });
  document.getElementById('btnConnAlways').addEventListener('click', function(){ ui.connectionMode='always'; updateConnectionButtons(); redrawConnectorsForMode(); });
  document.getElementById('filterStatus').addEventListener('change', function(e){ ui.filters.status=e.target.value; renderBoard(); redrawConnectorsForMode(); });
  document.getElementById('filterDependsOn').addEventListener('change', function(e){ ui.filters.dependsOn=e.target.value; renderBoard(); redrawConnectorsForMode(); });
  document.getElementById('filterResponsible').addEventListener('change', function(e){ ui.filters.responsible=e.target.value; renderBoard(); redrawConnectorsForMode(); });
  document.getElementById('btnClearFilters').addEventListener('click', function(){ ui.filters={status:'all',dependsOn:'all',responsible:'all',search:ui.filters.search}; renderAll(); });
  document.getElementById('searchInput').addEventListener('input', function(e){ ui.filters.search=e.target.value; renderBoard(); redrawConnectorsForMode(); });
  document.getElementById('btnRefresh').addEventListener('click', refreshAndRender);
  window.addEventListener('resize', function(){ redrawConnectorsForMode(); });

  var containerOverlay = document.getElementById('containerFormOverlay');
  document.getElementById('btnNovoContainer').addEventListener('click', function(){
    document.getElementById('cName').value=''; document.getElementById('cSubtitle').value='';
    document.getElementById('cType').value='programa'; document.getElementById('cColor').value='#15529E';
    document.getElementById('containerFormError').style.display='none';
    containerOverlay.style.display='flex';
  });
  document.getElementById('cCancel').addEventListener('click', function(){ containerOverlay.style.display='none'; });
  document.getElementById('cSave').addEventListener('click', async function(){
    var name = document.getElementById('cName').value.trim();
    var errEl = document.getElementById('containerFormError'); errEl.style.display='none';
    if(!name){ errEl.textContent='Dê um nome ao contêiner.'; errEl.style.display='block'; return; }
    var type = document.getElementById('cType').value;
    var subtitle = document.getElementById('cSubtitle').value.trim() || (type==='programa' ? 'Programa' : 'Frente transversal');
    var color = document.getElementById('cColor').value;
    var { error } = await sb.from('containers').insert({ name:name, type:type, subtitle:subtitle, color:color });
    if(error){ errEl.textContent='Erro ao salvar: '+error.message; errEl.style.display='block'; return; }
    containerOverlay.style.display='none';
    refreshAndRender();
  });

  var overlay = document.getElementById('formOverlay');
  document.getElementById('btnNovo').addEventListener('click', function(){
    document.getElementById('fContainers').innerHTML = state.containers.map(function(c){ return '<label style="display:flex; align-items:center; gap:7px; font-size:12.5px;"><input type="checkbox" value="'+c.id+'"> '+escapeHtml(c.name)+' <span style="color:var(--muted2); font-size:11px;">('+c.subtitle+')</span></label>'; }).join('');
    document.getElementById('fName').value=''; document.getElementById('fResp').value='Evandro'; document.getElementById('fDue').value='';
    overlay.style.display='flex';
  });
  document.getElementById('fCancel').addEventListener('click', function(){ overlay.style.display='none'; });
  document.getElementById('fSave').addEventListener('click', async function(){
    var name = document.getElementById('fName').value.trim();
    if(!name){ window.alert('Dê um nome ao item.'); return; }
    var containerIds = Array.from(document.querySelectorAll('#fContainers input:checked')).map(function(i){return i.value;});
    var newNode = await dbInsertNode({
      parent_id: null, name:name, type: document.getElementById('fType').value, status:'Nao iniciado',
      responsible: document.getElementById('fResp').value.trim()||'—', depends_on: document.getElementById('fDep').value,
      priority: document.getElementById('fPriority').value, due_date: document.getElementById('fDue').value||null,
      last_updated: todayISO()
    });
    if(newNode) await dbInsertNodeContainers(newNode.id, containerIds);
    overlay.style.display='none';
    refreshAndRender();
  });

  // ====== AUTENTICAÇÃO ======
  function showLogin(){ document.getElementById('loginOverlay').style.display='flex'; document.getElementById('appRoot').style.display='none'; }
  async function showApp(){
    document.getElementById('loginOverlay').style.display='none';
    document.getElementById('appRoot').style.display='flex';
    state = await fetchState();
    ui.expanded = defaultExpand();
    renderAll();
  }
  document.getElementById('btnLogin').addEventListener('click', doLogin);
  document.getElementById('loginPass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  async function doLogin(){
    var email = document.getElementById('loginEmail').value.trim();
    var pass = document.getElementById('loginPass').value;
    var errEl = document.getElementById('loginError'); errEl.style.display='none';
    var { error } = await sb.auth.signInWithPassword({ email:email, password:pass });
    if(error){ errEl.textContent = 'Falha no login: '+error.message; errEl.style.display='block'; return; }
    showApp();
  }
  document.getElementById('btnLogout').addEventListener('click', async function(){ await sb.auth.signOut(); location.reload(); });

  sb.auth.getSession().then(function(res){
    if(res.data.session) showApp(); else showLogin();
  });
})();
</script>
</body>
</html>
